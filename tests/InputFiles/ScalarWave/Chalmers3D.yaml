# Axis-aligned Gaussian pulse; periodic transverse faces preserve symmetry.
# Exercises joint hp AMR and the directional energy fit and variation guard.

Executable: EvolveScalarWave3D
Testing:
  Check: parse;execute
  Timeout: 60
ExpectedOutput:
- Reductions.h5
- Volume0.h5

---

Parallelization:
  ElementDistribution: NumGridPoints
ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
InitialData: &id002
  PlaneWave:
    WaveVector:
    - 1.0
    - 0.0
    - 0.0
    Center:
    - -1.8
    - -0.0
    - -0.0
    Profile:
      Gaussian:
        Amplitude: 1.0
        Width: 0.35
        Center: 0.0
Amr:
  Criteria:
  - Chalmers:
      VariablesToMonitor:
      - Psi
      - Pi
      - Phi
      AbsoluteTarget: 0.0001
      RelativeTarget: 0.0
      SmoothnessThreshold: 0.5
      PRefineOnly: false
      CoarseningFactor: 0.0
      HCoarsening: false
      UseDirectionalEnergy: true
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel:
      - 0
      - 3
      NumPolynomialModes:
      - 2
      - 20
      FourierM: Auto
      SphericalHarmonicL: Auto
      ErrorBeyondLimits: true
    AllowCoarsening: false
  Verbosity: Quiet
PhaseChangeAndTriggers:
- Trigger:
    Times:
      Specified:
        Values:
        - 0.04
        - 0.08
        - 0.12
        - 0.16
        - 0.2
        - 0.24
        - 0.28
        - 0.32
        - 0.36
        - 0.4
        - 0.44
        - 0.48
        - 0.52
        - 0.56
        - 0.6
        - 0.64
        - 0.68
        - 0.72
        - 0.76
        - 0.8
        - 0.84
        - 0.88
        - 0.92
        - 0.96
        - 1.0
        - 1.04
        - 1.08
        - 1.12
        - 1.16
  PhaseChanges:
  - VisitAndReturn(EvaluateAmrCriteria)
  - VisitAndReturn(AdjustDomain)
  - VisitAndReturn(CheckDomain)
Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001
  InitialSlabSize: 0.001
  MinimumTimeStep: 1.0e-08
  LocalTimeStepping: 'Off'
  TimeStepper:
    DormandPrince5: null
  LtsStepChoosers: null
  VariableOrderAlgorithm:
    GoalOrder: 5
DomainCreator:
  AlignedLattice:
    BlockBounds:
    - &id001
      - -1.0
      - 0.0
      - 1.0
    - *id001
    - *id001
    Distributions:
    - []
    - []
    - []
    SingularityPositions:
    - []
    - []
    - []
    InitialLevels:
    - 0
    - 0
    - 0
    InitialGridPoints:
    - 14
    - 3
    - 3
    RefinedLevels: []
    RefinedGridPoints:
    - LowerCornerIndex:
      - 1
      - 0
      - 0
      UpperCornerIndex:
      - 2
      - 2
      - 2
      Refinement:
      - 5
      - 3
      - 3
    BlocksToExclude: []
    BoundaryConditions:
    - DirichletAnalytic:
        AnalyticPrescription: *id002
    - Periodic
    - Periodic
SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty: null
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
    - None:
        BlocksToFilter: All
EventsAndTriggersAtSlabs:
- Trigger:
    Times:
      Specified:
        Values:
        - 0.0
        - 0.4
        - 0.8
        - 1.2
  Events:
  - ObserveAmrStats:
      PrintToTerminal: false
      ObservePerCore: false
  - ObserveNorms:
      SubfileName: Errors
      TensorsToObserve:
      - Name: Error(Psi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Pi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Phi)
        NormType: L2Norm
        Components: Sum
- Trigger:
    Times:
      Specified:
        Values:
        - 0.0
        - 1.2
  Events:
  - ObserveFields:
      SubfileName: Fields
      VariablesToObserve:
      - Psi
      - Pi
      - Phi
      InterpolateToMesh: None
      ProjectToMesh: None
      CoordinatesFloatingPointType: Double
      FloatingPointTypes:
      - Double
      BlocksToObserve: All
- Trigger:
    Times:
      Specified:
        Values:
        - 1.2
  Events:
  - Completion
- Trigger: Always
  Events:
  - ObserveTimeStep:
      SubfileName: TimeSteps
      PrintTimeToTerminal: false
      ObservePerCore: false
  - ChangeSlabSize:
      DelayChange: 0
      StepChoosers:
      - Constant: 0.001
      - StepToTimes:
          Times:
            Specified:
              Values:
              - 0.04
              - 0.08
              - 0.12
              - 0.16
              - 0.2
              - 0.24
              - 0.28
              - 0.32
              - 0.36
              - 0.4
              - 0.44
              - 0.48
              - 0.52
              - 0.56
              - 0.6
              - 0.64
              - 0.68
              - 0.72
              - 0.76
              - 0.8
              - 0.84
              - 0.88
              - 0.92
              - 0.96
              - 1.0
              - 1.04
              - 1.08
              - 1.12
              - 1.16
              - 1.2
EventsAndTriggersAtSteps: null
EventsAndTriggersAtCheckpoints: null
EventsAndDenseTriggers: null
Observers:
  VolumeFileName: Volume
  ReductionFileName: Reductions
