# Oblique Gaussian plane pulse crossing angular cubed-sphere interfaces.
# Accuracy, constraint and interface diagnostics: tools/Amr/ChalmersWedges.py.

Executable: EvolveScalarWave3D
Testing:
  Check: parse;execute
  Timeout: 60
ExpectedOutput:
- Reductions.h5
- Volume0.h5

---

Parallelization:
  ElementDistribution: NumGridPoints
ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
InitialData: &id001
  PlaneWave:
    WaveVector:
    - 0.2672612419124244
    - 0.5345224838248488
    - 0.8017837257372732
    Center:
    - -0.7483314773547882
    - -1.4966629547095764
    - -2.244994432064365
    Profile:
      Gaussian:
        Amplitude: 1.0
        Width: 0.8
        Center: 0.0
Amr:
  Criteria:
  - Chalmers:
      VariablesToMonitor:
      - Psi
      - Pi
      - Phi
      AbsoluteTarget: 1.0e-05
      RelativeTarget: 0.0
      SmoothnessThreshold: 1.0
      PRefineOnly: false
      CoarseningFactor: 0.0
      HCoarsening: false
      UseDirectionalEnergy: true
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel:
      - 0
      - 3
      NumPolynomialModes:
      - 2
      - 20
      FourierM: Auto
      SphericalHarmonicL: Auto
      ErrorBeyondLimits: true
    AllowCoarsening: false
  Verbosity: Quiet
PhaseChangeAndTriggers:
- Trigger:
    Times:
      Specified:
        Values:
        - 0.04
        - 0.08
        - 0.12
        - 0.16
