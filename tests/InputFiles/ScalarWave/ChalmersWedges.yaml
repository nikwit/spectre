        - 2.12
        - 2.16
        - 2.2
        - 2.24
        - 2.28
        - 2.32
        - 2.36
  PhaseChanges:
  - VisitAndReturn(EvaluateAmrCriteria)
  - VisitAndReturn(AdjustDomain)
  - VisitAndReturn(CheckDomain)
Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  InitialSlabSize: 0.0005
  MinimumTimeStep: 1.0e-08
  LocalTimeStepping: 'Off'
  TimeStepper:
    DormandPrince5: null
  LtsStepChoosers: null
  VariableOrderAlgorithm:
    GoalOrder: 5
DomainCreator:
  Sphere:
    InnerRadius: 1.0
    OuterRadius: 2.0
    Interior:
      ExciseWithBoundaryCondition: &id002
        DirichletAnalytic:
          AnalyticPrescription: *id001
    InitialRefinement:
    - 0
    - 0
    - 0
    InitialGridPoints:
    - - 10
      - 10
      - 14
    - - 18
      - 18
      - 14
    - - 14
      - 14
      - 14
    - - 18
      - 18
      - 14
    - - 14
      - 14
      - 14
    - - 16
      - 16
      - 14
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: Linear
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition: *id002
SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty: null
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
    - None:
        BlocksToFilter: All
EventsAndTriggersAtSlabs:
- Trigger:
    Times:
      Specified:
        Values: &id003
        - 0.0
        - 1.2
        - 2.4
  Events:
  - ObserveAmrStats:
      PrintToTerminal: false
      ObservePerCore: false
  - ObserveNorms:
      SubfileName: Errors
      TensorsToObserve:
      - Name: Error(Psi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Pi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Phi)
        NormType: L2Norm
        Components: Sum
- Trigger:
    Times:
