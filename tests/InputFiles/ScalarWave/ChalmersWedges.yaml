        Values: *id003
  Events:
  - ObserveFields:
      SubfileName: Fields
      VariablesToObserve:
      - Psi
      - Pi
      - Phi
      InterpolateToMesh: None
      ProjectToMesh: None
      CoordinatesFloatingPointType: Double
      FloatingPointTypes:
      - Double
      BlocksToObserve: All
- Trigger:
    Times:
      Specified:
