# Smooth outgoing pulse on curved wedges, crossing a radial AMR
# transition. The full accuracy and CFL study is in tools/Amr/ChalmersSphere.py.

Executable: EvolveScalarWave3D
Testing:
  Check: parse;execute
  Timeout: 60
ExpectedOutput:
- Reductions.h5
- Volume0.h5

---

Parallelization:
  ElementDistribution: NumGridPoints
ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
InitialData: &id001
  RegularSphericalWave:
    Profile:
      Gaussian:
        Amplitude: 1.0
        Width: 0.4
        Center: 1.4
Amr:
  Criteria:
  - Chalmers:
      VariablesToMonitor:
      - Psi
      - Pi
      - Phi
      AbsoluteTarget: 0.0001
      RelativeTarget: 0.0
      SmoothnessThreshold: 0.5
      PRefineOnly: false
      CoarseningFactor: 0.0
      HCoarsening: false
      UseDirectionalEnergy: true
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel:
      - 0
      - 3
      NumPolynomialModes:
      - 2
      - 20
      FourierM: Auto
      SphericalHarmonicL: Auto
      ErrorBeyondLimits: true
    AllowCoarsening: false
  Verbosity: Quiet
PhaseChangeAndTriggers:
- Trigger:
    Times:
      EvenlySpaced:
        Interval: 0.04
        Offset: 0.04
  PhaseChanges:
  - VisitAndReturn(EvaluateAmrCriteria)
  - VisitAndReturn(AdjustDomain)
  - VisitAndReturn(CheckDomain)
Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  InitialSlabSize: 0.0005
  MinimumTimeStep: 1.0e-08
  LocalTimeStepping: 'Off'
  TimeStepper:
    DormandPrince5: null
  LtsStepChoosers: null
  VariableOrderAlgorithm:
    GoalOrder: 5
DomainCreator:
  Sphere:
    InnerRadius: 1.0
    OuterRadius: 4.0
    Interior:
      ExciseWithBoundaryCondition: &id002
        DirichletAnalytic:
          AnalyticPrescription: *id001
    InitialRefinement:
    - 0
    - 0
    - 0
    InitialGridPoints:
      Shell0:
      - 14
      - 14
      - 18
      Shell1:
      - 14
      - 14
      - 16
      Shell2:
      - 14
      - 14
      - 8
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning:
    - 2.0
    - 3.0
    RadialDistribution: Linear
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition: *id002
SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty: null
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
    - None:
        BlocksToFilter: All
EventsAndTriggersAtSlabs:
- Trigger:
    Times:
      Specified:
        Values: &id003
        - 0.0
        - 0.4
        - 0.8
  Events:
  - ObserveAmrStats:
      PrintToTerminal: false
      ObservePerCore: false
  - ObserveNorms:
      SubfileName: Errors
      TensorsToObserve:
      - Name: Error(Psi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Pi)
        NormType: L2Norm
        Components: Sum
      - Name: Error(Phi)
        NormType: L2Norm
        Components: Sum
- Trigger:
    Times:
      Specified:
        Values: *id003
  Events:
  - ObserveFields:
      SubfileName: Fields
      VariablesToObserve:
      - Psi
      - Pi
      - Phi
      InterpolateToMesh: None
      ProjectToMesh: None
      CoordinatesFloatingPointType: Double
      FloatingPointTypes:
      - Double
      BlocksToObserve: All
- Trigger:
    Times:
      Specified:
        Values:
        - 0.8
  Events:
  - Completion
- Trigger: Always
  Events:
  - ObserveTimeStep:
      SubfileName: TimeSteps
      PrintTimeToTerminal: false
      ObservePerCore: false
  - ChangeSlabSize:
      DelayChange: 0
      StepChoosers:
      - Cfl:
          SafetyFactor: 0.5
      - StepToTimes:
          Times:
            Specified:
              Values:
              - 0.04
              - 0.08
              - 0.12
              - 0.16
              - 0.2
              - 0.24
              - 0.28
              - 0.32
              - 0.36
              - 0.4
              - 0.44
              - 0.48
              - 0.52
              - 0.56
              - 0.6
              - 0.64
              - 0.68
              - 0.72
              - 0.76
              - 0.8
EventsAndTriggersAtSteps: null
EventsAndTriggersAtCheckpoints: null
EventsAndDenseTriggers: null
Observers:
  VolumeFileName: Volume
  ReductionFileName: Reductions
