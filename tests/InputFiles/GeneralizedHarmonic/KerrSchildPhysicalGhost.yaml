Executable: EvolveGhSingleBlackHole
# First-stage physical ghost boundary: analytic incoming physical trace with
# live constraint-preserving and Sommerfeld gauge corrections. The centered
# Schwarzschild trace vanishes, so this is an equilibrium/integration check.
# The worldtube is outside the horizon; incoming physical modes are present.
Testing:
  Check: parse;execute
  Timeout: 120
  Priority: High
ExpectedOutput:
  - GhPhysicalGhostVolume0.h5
  - GhPhysicalGhostReductions.h5

---

Parallelization:
  ElementDistribution: NumGridPointsAndGridSpacing

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Evolution:
  InitialTime: 0.0
  # Global time stepping: the local-time-stepping step choosers do not
  # support the spherical-harmonic angular basis of the shells.
  InitialTimeStep: &time_step 0.002
  InitialSlabSize: *time_step
  MinimumTimeStep: 1e-7
  LocalTimeStepping: Off
  VariableOrderAlgorithm:
    GoalOrder: 4
  LtsStepChoosers:
  TimeStepper:
    AdamsBashforth:
      Order: 4

Amr:
  Criteria:
  EnableInBlocks: []
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel: Auto
      NumGridPoints: Auto
      ErrorBeyondLimits: False
    AllowCoarsening: True
  Verbosity: Quiet

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
       EvenlySpaced:
         # Current implementation checks wallclock at these global syncs
         Interval: 100
         Offset: 0
    PhaseChanges:
      - CheckpointAndExitAfterWallclock:
          WallclockHours: None

InitialData: &InitialData
  GeneralizedHarmonic(KerrSchild):
    Mass: 1.0
    Spin: [0.0, 0.0, 0.0]
    Center: &Center [0.0, 0.0, 0.0]
    Velocity: [0.0, 0.0, 0.0]

DomainCreator:
  SphericalShells:
    InnerRadius: &InnerRadius 2.5
    OuterRadius: 10.0
    InitialRadialRefinement: 1
    InitialNumberOfRadialGridPoints: 12
    InitialSphericalHarmonicL: 8
    RadialPartitioning: []
    RadialDistribution: Logarithmic
    TimeDependentMaps: None
    InnerBoundaryCondition:
      WorldtubePhysicalGhost:
        AnalyticPrescription: *InitialData
        GaugeSector: SommerfeldAbsorbing
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      AnalyticChristoffel:
        AnalyticPrescription: *InitialData
    # The parameter choices here come from our experience with the Spectral
    # Einstein Code (SpEC). They should be suitable for evolutions of a
    # perturbation of a Kerr-Schild black hole.
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]

SpatialDiscretization:
  BoundaryCorrection:
    AveragedUpwindPenalty:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      # Filter settings found stable over 200M of a single hole on these
      # shells: a weak radial exponential filter and the top four angular
      # modes removed, no exponential angular filter.
      - Hypercube:
          HalfPower: 200
          Enable: true
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None
      - SphericalShell:
          NumModesToKill: 4
          AngularHalfPower: None
          RadialHalfPower: None
          Enable: true
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: TimeSteps
          PrintTimeToTerminal: True
          ObservePerCore: False
      - ObserveNorms:
          SubfileName: Errors
          TensorsToObserve:
            - Name: Error(SpacetimeMetric)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Pi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Phi)
              NormType: L2Norm
              Components: Sum
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
          - Name: Lapse
            NormType: L2Norm
            Components: Individual
          - Name: PointwiseL2Norm(GaugeConstraint)
            NormType: L2Norm
            Components: Sum
          - Name: PointwiseL2Norm(ThreeIndexConstraint)
            NormType: L2Norm
            Components: Sum
          - Name: PointwiseL2Norm(FourIndexConstraint)
            NormType: L2Norm
            Components: Sum
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 5
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - SpacetimeMetric
            - Pi
            - Phi
            - GaugeH
            - PointwiseL2Norm(GaugeConstraint)
            - PointwiseL2Norm(ThreeIndexConstraint)
            - PointwiseL2Norm(FourIndexConstraint)
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
  - Trigger:
      Slabs:
        Specified:
          Values: [5]
    Events:
      - Completion

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:
    - ObserveTimeStepVolume:
        SubfileName: FailureTimeStep
        FloatingPointType: Double
        CoordinatesFloatingPointType: Float

Observers:
  VolumeFileName: "GhPhysicalGhostVolume"
  ReductionFileName: "GhPhysicalGhostReductions"
  SurfaceFileName: "GhPhysicalGhostSurfaces"

Interpolator:
  Verbosity: Silent

ApparentHorizons:
  LMax: 10
  ApparentHorizon: &Ah
    Criteria:
      - Residual:
          MinResidual: 1.e-2
          MaxResidual: 1.e-1
          MinResolutionL: 4
    InitialGuess:
      InitialL: &LMax 8
      InitialShape:
        Sphere:
          Radius: 2.2
          Center: *Center
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-2
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Verbose
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  ControlSystemSingleAh: *Ah
  ControlSystemCharSpeedAh: *Ah

InterpolationTargets:
  BondiSachsInterpolation:
    LMax: 16
    Radius: [100, 150, 200]
    Center: [0, 0, 0]
    AngularOrdering: Cce
  ExcisionBoundary: &ExBdry
    LMax: *LMax
    Center: *Center
    Radius: *InnerRadius
    AngularOrdering: "Strahlkorper"
  ControlSystemCharSpeedExcision: *ExBdry

Cce:
  BondiSachsOutputFilePrefix: "BondiSachs"

ControlSystems:
  WriteDataToDisk: true
  MeasurementsPerUpdate: 4
  DelayUpdate: true
  Verbosity: Silent
  Translation: None
  Shape: None
  Size: None
