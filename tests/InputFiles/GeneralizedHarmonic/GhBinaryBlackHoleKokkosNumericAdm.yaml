Executable: EvolveGhBinaryBlackHoleKokkos
Testing:
  Check: parse

---

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0002
  MinimumTimeStep: 1e-7
  TimeStepper: Rk5Tsitouras

InitialData:
  NumericInitialData:
    FileGlob: "/path/to/initial_data.h5"
    Subgroup: "VolumeData"
    ObservationValue: Last
    ObservationValueEpsilon: Auto
    ElementsAreIdentical: False
    Variables:
      SpatialMetric: SpatialMetric
      Lapse: Lapse
      Shift: Shift
      ExtrinsicCurvature: ExtrinsicCurvature

DomainCreator:
  CylindricalBinaryCompactObject:
    CenterA: &CenterA [3.0, 0.0, 0.0]
    CenterB: &CenterB [-3.0, 0.0, 0.0]
    RadiusA: &ObjectRadius 0.8
    RadiusB: *ObjectRadius
    IncludeInnerSphereA: true
    IncludeInnerSphereB: true
    IncludeOuterSphere: true
    UseEquiangularMap: true
    OuterRadius: 30.0
    InitialRefinement: 0
    InitialGridPoints: 5
    BoundaryConditions:
      InnerBoundary:
        DemandOutgoingCharSpeeds:
      OuterBoundary:
        ConstraintPreservingBjorhus:
          Type: ConstraintPreservingPhysical
    TimeDependentMaps: None

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      Harmonic:
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: *CenterA
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: *CenterA
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: *CenterA

Filtering:
  ExpFilter0:
    Alpha: 36.0
    HalfPower: 64
    Enable: true
    BlocksToFilter: All

SpatialDiscretization:
  DiscontinuousGalerkin:
    Quadrature: GaussLobatto

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - FindApparentHorizonBatchedBatchedObservationAhA
      - FindApparentHorizonBatchedBatchedObservationAhB
  - Trigger:
      Slabs:
        Specified:
          Values: [2]
    Events:
      - CompletionBatched

Observers:
  VolumeFileName: "GhBinaryBlackHoleKokkosNumericAdmVolume"
  ReductionFileName: "GhBinaryBlackHoleKokkosNumericAdmReductions"
  SurfaceFileName: "GhBinaryBlackHoleKokkosNumericAdmSurfaces"

ApparentHorizons:
  BatchedObservationAhA: &BatchedAh
    InitialGuess:
      LMax: &LMax 4
      Radius: &AhRadius 2.2
      Center: *CenterA
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-2
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Verbose
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  BatchedObservationAhB: *BatchedAh
  ControlSystemAhA: *BatchedAh
  ControlSystemAhB: *BatchedAh
  ControlSystemCharSpeedAhA: *BatchedAh
  ControlSystemCharSpeedAhB: *BatchedAh

InterpolationTargets:
  ControlSystemCharSpeedExcisionA:
    LMax: *LMax
    Radius: *ObjectRadius
    Center: *CenterA
    AngularOrdering: Strahlkorper
  ControlSystemCharSpeedExcisionB:
    LMax: *LMax
    Radius: *ObjectRadius
    Center: *CenterB
    AngularOrdering: Strahlkorper

ControlSystems:
  WriteDataToDisk: false
  MeasurementsPerUpdate: 4
  Verbosity: Silent
  Expansion: None
  Rotation: None
  Translation: None
  Skew: None
  ShapeA: None
  ShapeB: None
  SizeA: None
  SizeB: None
