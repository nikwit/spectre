Executable: EvolveGhNoBlackHoleKokkosBatched
Testing:
  Check: parse

---

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0002
  TimeStepper: Rk5Tsitouras

InitialData: &InitialData
  GeneralizedHarmonic(KerrSchild):
    Mass: 1.0
    Spin: [0.0, 0.0, 0.0]
    Center: &Center [0.0, 0.0, 0.0]
    Velocity: [0.0, 0.0, 0.0]

DomainCreator:
  Sphere:
    InnerRadius: 1.9
    OuterRadius: 2.3
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds:
    InitialRefinement: 0
    InitialGridPoints: 6
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: [Logarithmic]
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      ConstraintPreservingBjorhus:
        Type: ConstraintPreservingPhysical

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      Harmonic:
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: *Center
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: *Center
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: *Center

Filtering:
  ExpFilter0:
    Alpha: 36.0
    HalfPower: 64
    Enable: true
    BlocksToFilter: All

SpatialDiscretization:
  DiscontinuousGalerkin:
    Quadrature: GaussLobatto

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - FindApparentHorizonBatchedBatchedObservationAhA
      - FindApparentHorizonBatchedBatchedObservationAhB
      - ObserveNormsBatched:
          SubfileName: Norms
          TensorsToObserve:
            - Name: SpacetimeMetric
              NormType: L2Norm
              Components: Sum
            - Name: Pi
              NormType: L2Norm
              Components: Sum
            - Name: Phi
              NormType: L2Norm
              Components: Sum
  - Trigger:
      Slabs:
        Specified:
          Values: [2]
    Events:
      - CompletionBatched

Observers:
  VolumeFileName: "GhKerrSchildKokkosBatchedAhVolume"
  ReductionFileName: "GhKerrSchildKokkosBatchedAhReductions"
  SurfaceFileName: "GhKerrSchildKokkosBatchedAhSurfaces"

ApparentHorizons:
  BatchedObservationAhA: &BatchedAh
    InitialGuess:
      LMax: 4
      Radius: 2.2
      Center: *Center
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-2
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Verbose
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  BatchedObservationAhB: *BatchedAh
