# Standalone SpEC-style p refinement/coarsening with a fixed h mesh.

Executable: EvolveGhSingleBlackHole
Testing:
  Check: parse;execute
  Timeout: 240
ExpectedOutput:
- Volume0.h5
- Reductions.h5
- Surfaces.h5
---
Parallelization:
  ElementDistribution: NumGridPoints
ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  MinimumTimeStep: 1e-7
  InitialSlabSize: 0.0005
  LocalTimeStepping: 'Off'
  VariableOrderAlgorithm:
    GoalOrder: 5
  LtsStepChoosers: null
  TimeStepper:
    DormandPrince5: null
Amr:
  Criteria:
  - SpecSpectral:
      RelativeTruncationTarget: 0.0001
      ConstraintTargets:
      - 3.0e-05
      - 3.0e-05
      ForceDropPileUpModes: true
      MinimumModes: [7, 7, 8]
      CallsBetweenChanges: 2
      TimeBetweenChanges: 0.15
      TruncationErrorAdjustmentLimit: -1.0
      StartTime: 0.0
      Verbose: false
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel:
      - 0
      - 2
      NumPolynomialModes:
      - 6
      - 20
      FourierM: Auto
      SphericalHarmonicL: Auto
      ErrorBeyondLimits: true
    AllowCoarsening: true
  Verbosity: Quiet
PhaseChangeAndTriggers:
- Trigger:
    Times:
      Specified:
        Values:
        - 0.1
        - 0.2
  PhaseChanges:
  - VisitAndReturn(EvaluateAmrCriteria)
  - VisitAndReturn(AdjustDomain)
  - VisitAndReturn(CheckDomain)
InitialData:
  GeneralizedHarmonic(KerrSchild):
    Mass: 1.0
    Spin:
    - 0.0
    - 0.0
    - 0.0
    Center: &id001
    - 0.0
    - 0.0
    - 0.0
    Velocity:
    - 0.0
    - 0.0
    - 0.0
DomainCreator:
  Sphere:
    InnerRadius: 1.2
    OuterRadius: 20.0
    Interior:
      ExciseWithBoundaryCondition: DemandOutgoingCharSpeeds
    InitialRefinement:
    - 0
    - 0
    - 0
    InitialGridPoints:
    - 12
    - 12
    - 8
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning:
    - 2.0
    - 4.0
    - 8.0
    RadialDistribution: Logarithmic
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      ConstraintPreservingBjorhus:
        Type: ConstraintPreservingPhysical
        IncomingWaveProfile: None
EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      DampedHarmonic:
        SpatialDecayWidth: 17.0152695482514
        Amplitudes:
        - 1.0
        - 0.0
        - 1.0
        Exponents:
        - 2
        - 2
        - 2
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center:
        - 0.0
        - 0.0
        - 0.0
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center:
        - 0.0
        - 0.0
        - 0.0
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center:
        - 0.0
        - 0.0
        - 0.0
SpatialDiscretization:
  BoundaryCorrection:
    AveragedUpwindPenalty: null
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
    - Hypercube:
        HalfPower: 256
        Enable: true
        BlocksToFilter: All
        VolumeFilterOnSubstep: true
        BoundaryCorrectionFilterOnSubstep: false
        VolumeFilterEveryNSteps: None
        BoundaryCorrectionFilterEveryNSteps: None
EventsAndTriggersAtCheckpoints: null
EventsAndTriggersAtSlabs:
- Trigger:
    Times:
      Specified:
        Values:
        - 0.0
        - 0.1
        - 0.2
        - 0.3
  Events:
  - ObserveNorms:
      SubfileName: Norms
      TensorsToObserve:
      - Name: Lapse
        NormType: L2Norm
        Components: Individual
      - Name: PointwiseL2Norm(GaugeConstraint)
        NormType: L2Norm
        Components: Sum
      - Name: PointwiseL2Norm(ThreeIndexConstraint)
        NormType: L2Norm
        Components: Sum
      - Name: PointwiseL2Norm(FourIndexConstraint)
        NormType: L2Norm
        Components: Sum
      - Name: PointwiseL2Norm(GaugeConstraint)
        NormType: Max
        Components: Sum
      - Name: PointwiseL2Norm(ThreeIndexConstraint)
        NormType: Max
        Components: Sum
      - Name: PointwiseL2Norm(FourIndexConstraint)
        NormType: Max
        Components: Sum
  - ObserveFields:
      SubfileName: Fields
      VariablesToObserve:
      - SpacetimeMetric
      - Pi
      - Phi
      - Lapse
      - GaugeH
      InterpolateToMesh: None
      ProjectToMesh: None
      CoordinatesFloatingPointType: Double
      FloatingPointTypes:
      - Double
      BlocksToObserve: All
  - ApparentHorizon
  - ExcisionBoundary
- Trigger:
    Times:
      Specified:
        Values:
        - 0.0
        - 0.1
        - 0.2
        - 0.3
  Events:
  - ObserveAmrStats:
      PrintToTerminal: false
      ObservePerCore: false
  - ObserveFields:
      SubfileName: Meshes
      VariablesToObserve:
      - Lapse
      InterpolateToMesh: None
      ProjectToMesh: None
      CoordinatesFloatingPointType: Double
      FloatingPointTypes:
      - Double
      BlocksToObserve: All
- Trigger:
    Times:
      Specified:
        Values:
        - 0.3
  Events:
  - Completion
- Trigger: Always
  Events:
  - ObserveTimeStep:
      SubfileName: TimeSteps
      PrintTimeToTerminal: false
      ObservePerCore: false
  - ChangeSlabSize:
      DelayChange: 0
      StepChoosers:
      - Cfl:
          SafetyFactor: 0.5
      - StepToTimes:
          Times:
            Specified:
              Values:
              - 0.1
              - 0.2
              - 0.3
EventsAndTriggersAtSteps: null
EventsAndDenseTriggers: null
EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:
  - ObserveTimeStepVolume:
      SubfileName: FailureTimeStep
      FloatingPointType: Double
      CoordinatesFloatingPointType: Float
Observers:
  VolumeFileName: Volume
  ReductionFileName: Reductions
  SurfaceFileName: Surfaces
Interpolator:
  Verbosity: Silent
ApparentHorizons:
  LMax: 10
  ApparentHorizon: &id002
    Criteria:
    - Residual:
        MinResidual: 1.0e-08
        MaxResidual: 1.0e-06
        MinResolutionL: 6
    InitialGuess:
      InitialL: 8
      InitialShape:
        Sphere:
          Radius: 2.0
          Center: *id001
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1.0e-08
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Silent
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  ControlSystemSingleAh: *id002
  ControlSystemCharSpeedAh: *id002
InterpolationTargets:
  BondiSachsInterpolation:
    LMax: 16
    Radius:
    - 100
    - 150
    - 200
    Center:
    - 0
    - 0
    - 0
    AngularOrdering: Cce
  ExcisionBoundary: &id003
    LMax: 8
    Center: *id001
    Radius: 1.2
    AngularOrdering: Strahlkorper
  ControlSystemCharSpeedExcision: *id003
Cce:
  BondiSachsOutputFilePrefix: BondiSachs
ControlSystems:
  WriteDataToDisk: true
  MeasurementsPerUpdate: 4
  DelayUpdate: true
  Verbosity: Silent
  Translation: None
  Shape: None
  Size: None
