Executable: EvolveGhNoBlackHoleKokkosBatched
Testing:
  Check: parse;execute

---

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons:
    GhKokkosBatchedDriver:
      Exclusive: true
      Proc: Auto
    BatchedObservationAhA:
      Exclusive: false
      Proc: Auto
    BatchedObservationAhB:
      Exclusive: false
      Proc: Auto

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0002
  TimeStepper: Rk5Tsitouras

InitialData: &InitialData
  GeneralizedHarmonic(KerrSchild):
    Mass: 1.0
    Spin: [0.0, 0.0, 0.0]
    Center: [0.0, 0.0, 0.0]
    Velocity: [0.0, 0.0, 0.0]

DomainCreator:
  Sphere:
    InnerRadius: 1.9
    OuterRadius: 300.
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds:
    InitialRefinement: 1
    InitialGridPoints: 14
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: [10., 30., 60., 100., 150., 200., 250.]
    RadialDistribution:
      [Linear, Linear, Linear, Linear, Linear, Linear, Linear, Linear]
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      ConstraintPreservingBjorhus:
        Type: ConstraintPreservingPhysical

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      Harmonic:
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]

Filtering:
  ExpFilter0:
    Alpha: 36.0
    HalfPower: 64
    Enable: true
    BlocksToFilter: All

SpatialDiscretization:
  DiscontinuousGalerkin:
    Quadrature: GaussLobatto

EventsAndTriggersAtSlabs:
  #- Trigger:
  #    Slabs:
  #      EvenlySpaced:
  #        Interval: 10
  #        Offset: 10000
  #  Events:
  #    - ObserveNormsBatched:
  #        SubfileName: Norms
  #        TensorsToObserve:
  #          - Name: SpacetimeMetric
  #            NormType: L2Norm
  #            Components: Sum
  #          - Name: Pi
  #            NormType: L2Norm
  #            Components: Sum
  #          - Name: Phi
  #            NormType: L2Norm
  #            Components: Sum
  - Trigger:
      Slabs:
        Specified:
          Values: [1000]
    Events:
      - CompletionBatched

Observers:
  VolumeFileName: "GhKerrSchildKokkosBatchedVolume"
  ReductionFileName: "GhKerrSchildKokkosBatchedReductions"
  SurfaceFileName: "GhKerrSchildKokkosBatchedSurfaces"

# No trigger runs the horizon finders in this input; the options below
# only need to parse.
ApparentHorizons:
  BatchedObservationAhA: &BatchedAh
    InitialGuess:
      LMax: 4
      Radius: 2.2
      Center: [0.0, 0.0, 0.0]
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-2
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Quiet
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  BatchedObservationAhB: *BatchedAh
