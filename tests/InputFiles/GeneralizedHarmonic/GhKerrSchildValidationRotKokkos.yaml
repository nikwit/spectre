# Batched-GPU half of the validation pair; the CPU reference is
# GhKerrSchildValidationCpu.yaml. Both configure the identical evolution
# (domain, initial data, gauge, damping, filter, stepper, step size,
# boundary conditions). Their Error(...) reduction norms must agree far
# below truncation error; see agent-notes for the comparison recipe.

Executable: EvolveGhNoBlackHoleKokkosBatched
Testing:
  Check: parse;execute
  Timeout: 60

---

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0002
  TimeStepper: Rk5Tsitouras

InitialData: &InitialData
  GeneralizedHarmonic(KerrSchild):
    Mass: 1.0
    Spin: [0.0, 0.0, 0.0]
    Center: &Center [0.0, 0.0, 0.0]
    Velocity: [0.0, 0.0, 0.0]

DomainCreator:
  Sphere:
    InnerRadius: 1.9
    OuterRadius: 2.3
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds:
    InitialRefinement: 0
    InitialGridPoints: 6
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: [Logarithmic]
    WhichWedges: All
    TimeDependentMaps:
      RotationAboutZAxis:
        InitialTime: 0.0
        InitialAngle: 0.0
        InitialAngularVelocity: 0.05
        InitialAngularAcceleration: 0.0
    OuterBoundaryCondition:
      ConstraintPreservingBjorhus:
        Type: ConstraintPreservingPhysical

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      Harmonic:
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]

Filtering:
  ExpFilter0:
    Alpha: 36.0
    HalfPower: 64
    Enable: true
    BlocksToFilter: All

SpatialDiscretization:
  DiscontinuousGalerkin:
    Quadrature: GaussLobatto

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - ObserveNormsBatched:
          SubfileName: Norms
          TensorsToObserve:
            - Name: SpacetimeMetric
              NormType: L2Norm
              Components: Sum
            - Name: Pi
              NormType: L2Norm
              Components: Sum
            - Name: Phi
              NormType: L2Norm
              Components: Sum
      - ObserveNormsBatched:
          SubfileName: Errors
          TensorsToObserve:
            - Name: Error(SpacetimeMetric)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Pi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Phi)
              NormType: L2Norm
              Components: Sum
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 5
          Offset: 0
    Events:
      - ObserveFieldsBatched:
          SubfileName: VolumeData
  - Trigger:
      Slabs:
        Specified:
          Values: [10]
    Events:
      - CompletionBatched

Observers:
  VolumeFileName: "GhKerrSchildValidationRotKokkosVolume"
  ReductionFileName: "GhKerrSchildValidationRotKokkosReductions"
  SurfaceFileName: "GhKerrSchildValidationRotKokkosSurfaces"

# No trigger runs the horizon finders in this input; the options below
# only need to parse.
ApparentHorizons:
  BatchedObservationAhA: &BatchedAh
    InitialGuess:
      LMax: 4
      Radius: 2.2
      Center: *Center
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-2
      DivergenceTol: 1.2
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Quiet
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: All
  BatchedObservationAhB: *BatchedAh
